<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0a0a0f"/>
  <rect x="0" y="0" width="1200" height="4" fill="#10b981"/>
  <!-- Terminal window -->
  <rect x="100" y="120" width="1000" height="390" rx="12" fill="#0d1117" stroke="#1e293b" stroke-width="2"/>
  <!-- Title bar -->
  <rect x="100" y="120" width="1000" height="40" rx="12" fill="#161b22"/>
  <rect x="100" y="148" width="1000" height="12" fill="#161b22"/>
  <circle cx="130" cy="140" r="6" fill="#ff5f57"/>
  <circle cx="152" cy="140" r="6" fill="#febc2e"/>
  <circle cx="174" cy="140" r="6" fill="#28c840"/>
  <text x="600" y="145" font-family="monospace" font-size="13" fill="#8b949e" text-anchor="middle">epos@v5:~</text>
  <!-- Terminal content -->
  <text x="140" y="210" font-family="monospace" font-size="18" fill="#10b981">$ whoami</text>
  <text x="140" y="250" font-family="'Space Grotesk', sans-serif" font-size="42" font-weight="700" fill="#f1f5f9">EPOS V5</text>
  <text x="140" y="300" font-family="monospace" font-size="18" fill="#8b949e">Enterprise POS Systems Engineer</text>
  <text x="140" y="350" font-family="monospace" font-size="16" fill="#64748b">C# · .NET 8 · gRPC · WPF · Xamarin</text>
  <text x="140" y="410" font-family="monospace" font-size="18" fill="#10b981">$ cat stats.txt</text>
  <text x="140" y="450" font-family="monospace" font-size="15" fill="#94a3b8">30+ modules | 20+ payments | $200K+ revenue | 99.9% uptime</text>
  <!-- Accent line -->
  <rect x="100" y="506" width="1000" height="4" fill="#10b981" opacity="0.6"/>
  <!-- Footer -->
  <text x="600" y="570" font-family="monospace" font-size="14" fill="#475569" text-anchor="middle">EPOS Singapore · Enterprise POS ecosystem · 2020 — Present</text>
</svg>
